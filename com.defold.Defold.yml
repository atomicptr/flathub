id: com.defold.Defold
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Platform
runtime-version: "25.08"

tags:
  - proprietary

command: com.defold.Defold

finish-args:
  - --share=network
  - --share=ipc
  - --device=dri
  - --socket=x11
  - --socket=pulseaudio
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: glu
    sources:
      - type: archive
        url: "https://archive.mesa3d.org/glu/glu-9.0.2.tar.gz"
        sha256: "24effdfb952453cc00e275e1c82ca9787506aba0282145fff054498e60e19a65"
  - name: defold
    buildsystem: simple
    build-commands:
      - install -Dm755 launch.sh /app/bin/${FLATPAK_ID}
      - install -Dm755 Defold /app/defold/Defold
      - install -Dm644 config /app/defold/config
      - install -Dm644 logo_blue.png /app/defold/logo_blue.png
      - cp -r packages /app/defold/packages
      - install -Dm644 Defold.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 logo-defold.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    post-install:
      # Disable editor updates; We'll handle this via Flatpak updates
      - sed -i 's/\(channel = \).*/\1/' /app/defold/config
    sources:
      - type: archive
        url: "https://github.com/defold/defold/releases/download/1.12.0/Defold-x86_64-linux.tar.gz"
        sha256: "739e8faf9af94ee1edac2a263e91fe1c8c3e305cbf656c1675bc4aa22a2f70f5"
      - type: file
        path: launch.sh
      - type: file
        path: logo-defold.svg
      - type: file
        path: Defold.desktop
